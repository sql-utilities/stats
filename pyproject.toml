[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stats"
version = "0.1.0"
description = "Read-only CLI utility to print table and column statistics of a SQL database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
stats = "stats.cli:main"

[tool.setuptools.packages.find]
include = ["stats*"]
